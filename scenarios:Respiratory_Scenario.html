<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elevate EMS — Respiratory Distress Scenario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#02273D;
    --navy-2:#05365a;
    --orange:#EF892F;
    --gold:#F6D55B;
    --cream:#FBF6EC;
    --deep-orange:#F47324;
    --monitor-bg:#081210;
    --critical:#F45B4C;
    --caution:#F6D55B;
    --stable:#3CE07A;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:linear-gradient(180deg,var(--navy) 0%, #01151f 100%);color:var(--cream);font-family:'Manrope',sans-serif;min-height:100vh;}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px;}

  header{display:flex;align-items:center;gap:14px;padding:10px 4px 16px;flex-wrap:wrap;}
  .badge-logo{width:56px;height:56px;flex-shrink:0;}
  .badge-logo img{width:100%;height:100%;object-fit:contain;}
  header h1{font-family:'Cinzel',serif;font-size:1.35rem;letter-spacing:0.04em;margin:0;color:var(--cream);}
  header .sub{font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-top:2px;}

  .phase-track-row{display:flex;justify-content:center;align-items:center;position:relative;padding:6px 0 18px;border-bottom:1px solid rgba(251,246,236,0.12);margin-bottom:20px;}
  .phase-track{display:flex;gap:10px;align-items:center;}
  .phase-pill{font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;font-weight:800;color:rgba(251,246,236,0.35);}
  .phase-pill.active{color:var(--orange);}
  .phase-pill.done{color:var(--gold);}
  .phase-arrow{color:rgba(251,246,236,0.25);font-size:0.75rem;}

  .stage{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;margin-bottom:18px;align-items:stretch;}
  .stage.single{grid-template-columns:1fr;}
  @media(max-width:600px){.stage{gap:8px;}}

  .panel{background:var(--navy-2);border:1px solid rgba(251,246,236,0.1);border-radius:14px;padding:18px;}
  .panel-label{font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px;}

  .scene-box{display:flex;flex-direction:column;align-items:center;height:100%;}


  .image-slot{width:100%;flex:1;min-height:0;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .image-slot.image-slot-empty{border:2px dashed rgba(239,137,47,0.5);background:rgba(239,137,47,0.05);}
  .image-slot img{width:100%;height:100%;object-fit:contain;}
  .image-slot-empty{flex-direction:column;gap:10px;padding:20px;text-align:center;}
  .image-slot-label{font-size:0.75rem;color:rgba(251,246,236,0.4);letter-spacing:0.04em;}



  .monitor-v2{background:var(--navy-2);border:1px solid rgba(251,246,236,0.1);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;aspect-ratio:748/573;align-self:start;}
  .monitor-svg{width:100%;height:auto;display:block;}
  .monitor-v2-placeholder{color:rgba(251,246,236,0.35);font-size:0.85rem;text-align:center;padding:20px;line-height:1.5;}
  .mv-val{font-family:'Share Tech Mono',monospace;font-size:34px;font-weight:700;}
  .mv-val-sm{font-family:'Share Tech Mono',monospace;font-size:25px;font-weight:700;}

  .story{background:var(--cream);color:var(--navy);border-radius:14px;padding:22px 24px;}
  .story-phase{font-size:0.66rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--orange);font-weight:800;margin-bottom:8px;}
  .scene-prop{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .scene-prop img{width:52px;height:52px;object-fit:contain;background:rgba(2,39,61,0.04);border-radius:8px;padding:6px;flex-shrink:0;}
  .scene-prop span{font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:800;color:rgba(2,39,61,0.5);}
  .story-text{font-size:1rem;line-height:1.55;min-height:3em;white-space:pre-wrap;}
  .cursor{display:inline-block;width:2px;background:var(--navy);margin-left:1px;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  .feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:0.88rem;line-height:1.45;}
  .fb-good{background:rgba(60,150,90,0.1);border:1px solid rgba(60,150,90,0.35);color:#1f5c3a;}
  .fb-mid{background:rgba(239,137,47,0.1);border:1px solid rgba(239,137,47,0.35);color:#8a4c11;}
  .fb-bad{background:rgba(244,91,76,0.1);border:1px solid rgba(244,91,76,0.4);color:#8f2a20;}

  .choices{display:grid;gap:10px;margin-top:18px;}
  .choice-btn{text-align:left;background:#fff;border:1.5px solid rgba(2,39,61,0.15);border-radius:10px;padding:13px 16px;font-family:'Manrope';font-size:0.92rem;color:var(--navy);cursor:pointer;transition:all .15s ease;font-weight:600;}
  .choice-btn:hover{border-color:var(--orange);background:#fff7ef;transform:translateX(2px);}
  .choice-btn:disabled{opacity:0.45;cursor:default;transform:none;}
  .choice-btn .letter{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--navy);color:var(--cream);font-size:0.72rem;text-align:center;line-height:22px;margin-right:10px;font-weight:800;}

  .continue-btn{margin-top:18px;background:var(--orange);color:var(--navy);border:none;border-radius:10px;padding:12px 22px;font-weight:800;font-size:0.92rem;cursor:pointer;letter-spacing:0.02em;}
  .continue-btn:hover{background:var(--deep-orange);color:#fff;}
  .continue-btn:disabled{opacity:0.4;cursor:default;}

  /* COLLAPSIBLE LOG */
  .log-details{margin-top:18px;}
  .log-details summary{cursor:pointer;list-style:none;font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(251,246,236,0.55);font-weight:800;padding:10px 14px;background:var(--navy-2);border:1px solid rgba(251,246,236,0.12);border-radius:8px;display:flex;align-items:center;gap:8px;}
  .log-details summary::-webkit-details-marker{display:none;}
  .log-details summary:before{content:'▸';font-size:0.7rem;transition:transform .15s;}
  .log-details[open] summary:before{transform:rotate(90deg);}
  .log-details summary:hover{color:var(--gold);}
  .log-body{padding-top:10px;}
  .log-item{font-size:0.82rem;padding:8px 12px;border-radius:8px;background:rgba(251,246,236,0.04);margin-bottom:6px;border-left:3px solid rgba(251,246,236,0.15);}
  .log-item.good{border-left-color:var(--stable);}
  .log-item.mid{border-left-color:var(--gold);}
  .log-item.bad{border-left-color:var(--critical);}

  .debrief{background:var(--cream);color:var(--navy);border-radius:14px;padding:28px;text-align:center;}
  .debrief h2{font-family:'Cinzel',serif;font-size:1.5rem;margin:0 0 6px;}
  .tier{font-size:1rem;font-weight:800;color:var(--orange);margin-bottom:18px;}
  .score-circle{width:90px;height:90px;border-radius:50%;border:5px solid var(--orange);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-family:'Share Tech Mono';font-size:1.5rem;font-weight:700;}

  .loading{text-align:center;padding:60px 20px;color:rgba(251,246,236,0.5);}

  /* INTERVIEW */
  .interview-layout{display:grid;grid-template-columns:1fr 190px;gap:16px;margin-top:16px;}
  @media(max-width:700px){.interview-layout{grid-template-columns:1fr;}}
  .chat-panel-label{font-size:0.66rem;letter-spacing:0.1em;text-transform:uppercase;font-weight:800;color:rgba(2,39,61,0.45);margin-bottom:6px;}
  .chat-window{background:#f1ede2;border:1.5px solid rgba(2,39,61,0.1);border-radius:10px;padding:14px;max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:60px;}
  .chat-window-empty{color:rgba(2,39,61,0.35);font-size:0.85rem;font-style:italic;}
  .chat-bubble{max-width:82%;padding:9px 13px;border-radius:12px;font-size:0.88rem;line-height:1.4;}
  .chat-you{align-self:flex-end;background:var(--navy);color:var(--cream);border-bottom-right-radius:3px;}
  .chat-patient{align-self:flex-start;background:#fff;color:var(--navy);border:1px solid rgba(2,39,61,0.1);border-bottom-left-radius:3px;}
  .chat-typing{align-self:flex-start;background:#f1ede2;color:rgba(2,39,61,0.5);font-style:italic;font-size:0.82rem;padding:8px 12px;border-radius:12px;}
  .chat-input-row{display:flex;gap:8px;margin-top:10px;}
  .chat-input{flex:1;padding:11px 13px;border-radius:8px;border:1.5px solid rgba(2,39,61,0.18);font-family:'Manrope';font-size:0.9rem;color:var(--navy);}
  .chat-input:focus{outline:none;border-color:var(--orange);}
  .ask-btn{background:var(--navy);color:var(--cream);border:none;border-radius:8px;padding:0 18px;font-weight:700;cursor:pointer;font-size:0.85rem;}
  .ask-btn:hover{background:var(--navy-2);}
  .ask-btn:disabled{opacity:0.5;cursor:default;}

  .sample-panel{background:#f1ede2;border-radius:10px;padding:12px;}
  .sample-title{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--navy);font-weight:800;margin-bottom:8px;opacity:0.7;}
  .sample-item{display:flex;align-items:center;gap:8px;font-size:0.8rem;padding:5px 0;color:rgba(2,39,61,0.55);}
  .sample-item.done{color:var(--navy);font-weight:700;}
  .sample-check{width:16px;height:16px;border-radius:4px;border:1.5px solid rgba(2,39,61,0.3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.65rem;}
  .sample-item.done .sample-check{background:var(--orange);border-color:var(--orange);color:#fff;}

  /* REPORT */
  .report-textarea{width:100%;min-height:120px;padding:13px;border-radius:10px;border:1.5px solid rgba(2,39,61,0.18);font-family:'Manrope';font-size:0.9rem;color:var(--navy);resize:vertical;margin-top:10px;}
  .report-textarea:focus{outline:none;border-color:var(--orange);}
  .report-hint{font-size:0.78rem;color:rgba(2,39,61,0.55);margin-top:8px;line-height:1.4;}
  .submit-report-btn{margin-top:12px;background:var(--orange);color:var(--navy);border:none;border-radius:10px;padding:11px 20px;font-weight:800;cursor:pointer;}
  .submit-report-btn:hover{background:var(--deep-orange);color:#fff;}
  .submit-report-btn:disabled{opacity:0.4;cursor:default;}
  .compare-block{margin-top:16px;padding-top:16px;border-top:1px dashed rgba(2,39,61,0.2);}
  .compare-label{font-size:0.66rem;letter-spacing:0.12em;text-transform:uppercase;font-weight:800;margin-bottom:6px;}
  .your-report{background:#f1ede2;border-radius:8px;padding:12px 14px;font-size:0.87rem;line-height:1.5;margin-bottom:14px;}
  .model-report{background:rgba(60,150,90,0.08);border:1px solid rgba(60,150,90,0.3);border-radius:8px;padding:12px 14px;font-size:0.87rem;line-height:1.5;}
  .self-score-block{margin-top:16px;padding-top:16px;border-top:1px dashed rgba(2,39,61,0.2);}
  .self-score-row{display:flex;gap:8px;margin-top:8px;}
  .self-score-scale{font-size:0.72rem;color:rgba(2,39,61,0.5);margin-top:8px;}
  .score-btn{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(2,39,61,0.25);background:#fff;color:var(--navy);font-weight:800;font-size:0.95rem;cursor:pointer;font-family:'Manrope';}
  .score-btn:hover:not(:disabled){border-color:var(--orange);color:var(--orange);}
  .score-btn.selected{background:var(--orange);border-color:var(--orange);color:var(--navy);}
  .score-btn:disabled{opacity:0.5;cursor:default;}
  .score-btn.selected:disabled{opacity:1;}

  /* AIRWAY / MED BAG GRID */
  .item-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px;margin-top:16px;}
  .item-grid.compact{gap:6px;}
  .item-grid.compact .item-card{padding:4px;}
  .item-grid.compact .item-label{font-size:0.68rem;line-height:1.2;min-height:28px;}
  .item-grid.compact .item-image{font-size:0.48rem;}
  @media(max-width:600px){
    .item-grid.compact{gap:4px;}
    .item-grid.compact .item-card{padding:3px;}
    .item-grid.compact .item-label{font-size:0.6rem;}
    .item-grid{gap:8px;grid-template-columns:repeat(4,minmax(0,1fr));}
    .item-grid .item-label{font-size:0.8rem;}
    .item-grid .item-sub{font-size:0.68rem;}
  }
  .item-card{border:1.5px solid var(--orange);border-radius:10px;padding:10px;cursor:pointer;text-align:center;background:#fff;transition:all .15s ease;position:relative;min-width:0;display:flex;flex-direction:column;}
  .item-card:hover{border-color:var(--orange);}
  .item-card.selected{border-width:3px;border-color:var(--deep-orange);background:#fff7ef;}
  .item-card .item-image{width:100%;aspect-ratio:1/1;border-radius:7px;background:rgba(2,39,61,0.05);border:none;display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:rgba(2,39,61,0.35);margin-bottom:8px;overflow:hidden;}
  .item-card .item-image img{width:100%;height:100%;object-fit:contain;padding:6px;}
  .item-card .item-label{font-size:0.88rem;font-weight:700;color:var(--navy);line-height:1.25;overflow-wrap:normal;word-break:normal;min-height:36px;display:flex;align-items:center;justify-content:center;}
  .item-card .item-sub{font-size:0.74rem;color:rgba(2,39,61,0.5);margin-top:2px;overflow-wrap:normal;word-break:normal;min-height:16px;display:flex;align-items:center;justify-content:center;}
  .item-check{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--orange);color:#fff;font-size:0.68rem;display:none;align-items:center;justify-content:center;}
  .item-card.selected .item-check{display:flex;}

  .flow-row{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .flow-row label{font-size:0.85rem;font-weight:700;color:var(--navy);}
  .flow-input{width:80px;padding:9px 10px;border-radius:8px;border:1.5px solid rgba(2,39,61,0.2);font-family:'Manrope';font-size:0.9rem;}
  .flow-input:focus{outline:none;border-color:var(--orange);}

  .secondary-btn{background:transparent;color:var(--navy);border:1.5px solid rgba(2,39,61,0.25);border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;font-size:0.85rem;}
  .secondary-btn:hover{border-color:var(--navy);}
  .step-actions{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:16px;}

  /* RESET BUTTON — plain text style, not a banner */
  .reset-bar{display:inline-flex;align-items:center;gap:6px;background:transparent;color:rgba(251,246,236,0.55);border:none;padding:8px 4px;font-family:'Manrope';font-weight:700;font-size:0.8rem;letter-spacing:0.04em;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
  .reset-bar:hover{color:var(--orange);}
  .reset-bar svg{width:13px;height:13px;}
  .reset-bar-row{display:flex;justify-content:center;margin-top:20px;}

  /* MODAL OVERLAY (used for reset confirm, alerts, and the profanity warning) */
  .modal-overlay{position:fixed;inset:0;background:rgba(2,39,61,0.92);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;}
  .modal-card{background:var(--cream);color:var(--navy);border-radius:14px;padding:32px 28px;max-width:420px;text-align:center;}
  .modal-icon{width:46px;height:46px;border-radius:50%;background:var(--deep-orange);color:#fff;font-weight:800;font-size:1.4rem;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .modal-card p{line-height:1.55;font-size:0.95rem;margin-bottom:6px;}
  .modal-card .reset-bar{margin-top:14px;color:var(--navy);}
  .modal-card .reset-bar:hover{color:var(--deep-orange);}

  @media(prefers-reduced-motion: reduce){
    .cursor{animation:none !important;}
  }
</style>
</head>

/* Reusable for future scenarios where medication ORDER matters (this respiratory
   scenario doesn't need it — albuterol + atrovent are fine given together).
   Example future use in an evaluateMeds():
     cardiac chest pain:   checkMedOrder(selectedIds, ['aspirin','nitro'])   must be true
     allergic reaction:    checkMedOrder(selectedIds, ['assist_epipen','assist_inhaler']) must be true
   Returns true if requiredOrder appears as an in-order subsequence of selectedIds
   (extra/unrelated picks in between are fine — only relative order is checked). */
function checkMedOrder(selectedIds, requiredOrder){
  let i = 0;
  for(const id of selectedIds){
    if(id === requiredOrder[i]){
      i++;
      if(i === requiredOrder.length) return true;
    }
  }
  return i === requiredOrder.length;
}

/* ---------------- STATE ---------------- */
const DEFAULT_STATE = {
  step:'s0',
  vitals:{hr:118,rr:32,spo2:84,sbp:156,dbp:94,temp:98.6},
  vitalsUnlocked:{hr:false,rr:false,spo2:false,nibp:false,temp:false},
  vitalsAnswers:{},
  resourcesAnswers:{},
  score:0,
  log:[],
  chatLog:[],
  sampleProgress:{},
  painAsked:false,
  painReported:false,
  opqrstProgress:{},
  firedResponses:{},
  reportAnswers:{},
  reportSelfScores:{},
  airwayAnswers:{},
  medAnswers:{},
  ppeAnswers:{},
  treatedProperly:false
};

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));


function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function classifyHR(v){ if(v>120||v<50) return 'red'; if(v>100||v<60) return 'gold'; return 'green'; }
function classifyRR(v){ if(v>28||v<10) return 'red'; if(v>20||v<12) return 'gold'; return 'green'; }
function classifySpO2(v){ if(v<90) return 'red'; if(v<95) return 'gold'; return 'green'; }
function classifySBP(v){ if(v>160||v<90) return 'red'; if(v>140||v<100) return 'gold'; return 'green'; }
function classifyTemp(v){ if(v>=102||v<=95) return 'red'; if(v>=100.4||v<97) return 'gold'; return 'green'; }
function overallStatus(){
  const cls=[classifyHR(state.vitals.hr),classifyRR(state.vitals.rr),classifySpO2(state.vitals.spo2),classifySBP(state.vitals.sbp)];
  if(cls.includes('red')) return 'critical';
  if(cls.includes('gold')) return 'caution';
  return 'stable';
}
/* Once proper oxygen + medication have both been given (treatedProperly),
   a still-critical vital picture reads as "IMPROVING" (calm gold, no pulse)
   rather than a flashing red alarm — the numbers just haven't caught up
   to the correct treatment yet. Actual critical-before-treatment still
   flashes red as a genuine alarm. */
function displayStatus(){
  const raw = overallStatus();
  if(state.treatedProperly && raw !== 'stable') return 'improving';
  return raw;
}
/* Used to open the narrative right after an intervention with how the
   patient is actually responding, based on current vitals - even though
   we don't show a status badge anymore, the underlying read still drives
   the story. */
function patientTrendBlurb(){
  if(!Object.values(state.vitalsUnlocked).some(Boolean)) return '';
  const st = displayStatus();
  const map = {
    critical:"He's still struggling significantly, with little improvement so far. ",
    caution:"He's showing some improvement, but still working to breathe. ",
    improving:"He's responding well to treatment, though not fully recovered yet. ",
    stable:"He's breathing noticeably easier now. "
  };
  return map[st] || '';
}
/* Dedicated blurb for the reassessment right after meds (s8) - kept distinct
   from patientTrendBlurb so two consecutive slides don't repeat the same
   line, and phrased so fatigue + persistent dyspnea in the "improving" case
   naturally sets up CPAP as a sensible next consideration. */
function postMedsTrendBlurb(){
  if(!Object.values(state.vitalsUnlocked).some(Boolean)) return '';
  const st = displayStatus();
  const map = {
    critical:"He's still struggling significantly, with little improvement so far. ",
    caution:"He's showing some improvement, but still working to breathe. ",
    improving:"He begins showing improvement, but reports he's tired and still can't quite catch his breath. ",
    stable:"He's breathing noticeably easier now. "
  };
  return map[st] || '';
}
/* Used specifically right after oxygen alone (before any bronchodilator has
   been given) - stays modest since O2 only addresses hypoxia, not the
   underlying bronchospasm driving his work of breathing. */
function o2OnlyTrendBlurb(){
  if(!Object.values(state.vitalsUnlocked).some(Boolean)) return '';
  const spo2 = state.vitals.spo2;
  if(spo2 >= 90){
    return "His oxygen saturation is trending upward — now in the low 90s — though he's still working hard to breathe. The bronchospasm itself hasn't been addressed yet. ";
  }
  return "His oxygen saturation hasn't improved much yet, and he's still working hard to breathe. ";
}
function contactMade(){ return STEP_ORDER.indexOf(state.step) >= STEP_ORDER.indexOf(CONTACT_STEP); }

/* ---------------- PERSISTENCE (localStorage — works standalone / on GitHub Pages) ---------------- */
const LS_PROGRESS_KEY = 'elevate-ems-scenario-progress';

function saveProgress(){ try{ localStorage.setItem(LS_PROGRESS_KEY, JSON.stringify(state)); }catch(e){ console.error('Save failed', e); } }
function loadProgress(){ try{ const raw = localStorage.getItem(LS_PROGRESS_KEY); if(raw){ state = JSON.parse(raw); } }catch(e){} }
function clearProgress(){ try{ localStorage.removeItem(LS_PROGRESS_KEY); }catch(e){} }

/* ---------------- PATIENT RESPONSE ENGINE ---------------- */
function getPatientReply(question){
  for(const r of PATIENT_RESPONSES){
    if(r.test.test(question)){
      if(state.firedResponses[r.id]){
        return UNSURE_REPLIES[Math.floor(Math.random()*UNSURE_REPLIES.length)];
      }
      state.firedResponses[r.id] = true;
      if(r.sample) state.sampleProgress[r.sample] = true;
      if(r.painAsked) state.painAsked = true;
      if(r.painReported) state.painReported = true;
      return r.reply;
    }
  }
  return UNSURE_REPLIES[Math.floor(Math.random()*UNSURE_REPLIES.length)];
}

/* ---------------- PROFANITY GUARD ---------------- */
const PROFANITY_PATTERNS = [/\bass\b/i,/\bassholes?\b/i,/\bfuck\w*\b/i,/\bbitch\w*\b/i,/\bcunt\w*\b/i,/\bshit\w*\b/i,/\bdamn\w*\b/i];
function containsProfanity(text){ return PROFANITY_PATTERNS.some(p => p.test(text)); }
function showProfanityWarning(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <div class="modal-icon">!</div>
      <p>Patient rapport and safety should always come first.</p>
      <p>Professionalism and patience are essential traits for any provider — healthcare needs more of both. Please reset and continue with the respect this work calls for.</p>
      <button class="reset-bar" id="profanityResetBtn">${resetIconSVG()} Reset Scenario</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('profanityResetBtn').onclick = ()=>{
    document.body.removeChild(overlay);
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    clearProgress();
    renderApp();
  };
}

/* Generic modals — used instead of window.alert()/confirm(), which are
   unreliable (often silently blocked) inside sandboxed preview iframes. */
function showAlertModal(message){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <p>${escapeHtml(message)}</p>
      <button class="reset-bar" id="modalOkBtn" style="text-decoration:none;background:var(--orange);color:var(--navy);padding:10px 20px;border-radius:8px;">OK</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('modalOkBtn').onclick = ()=>document.body.removeChild(overlay);
}

function showConfirmModal(message, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <p>${escapeHtml(message)}</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;">
        <button class="secondary-btn" id="modalCancelBtn" style="margin:0;">Cancel</button>
        <button class="continue-btn" id="modalConfirmBtn" style="margin:0;">Confirm</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('modalCancelBtn').onclick = ()=>document.body.removeChild(overlay);
  document.getElementById('modalConfirmBtn').onclick = ()=>{
    document.body.removeChild(overlay);
    onConfirm();
  };
}

/* ---------------- PHASE TRACK ---------------- */
function renderPhaseTrack(){
  const phases=['SCENE','AMBULANCE','HOSPITAL'];
  const stepData = STEPS[state.step];
  const currentIdx = phases.indexOf(stepData.phase);
  const el=document.getElementById('phaseTrack');
  el.innerHTML = phases.map((p,i)=>{
    const cls = i<currentIdx?'done':(i===currentIdx?'active':'');
    const arrow = i<phases.length-1 ? '<span class="phase-arrow">&#8594;</span>' : '';
    return `<span class="phase-pill ${cls}">${p}</span>${arrow}`;
  }).join('');
}

/* ---------------- STAGE (image placeholder + monitor) ---------------- */
function renderMonitorSVG(){
  const u = state.vitalsUnlocked;
  const v = state.vitals;
  const dim = '#3a4652';

  const hrColor = u.hr ? '#3CE07A' : dim;      // green
  const hrText = u.hr ? v.hr : '--';
  const spo2Color = u.spo2 ? '#39C7EB' : dim;  // blue
  const spo2Text = u.spo2 ? v.spo2 : '--';
  const rrColor = u.rr ? '#EF892F' : dim;      // orange
  const rrText = u.rr ? v.rr : '--';
  const tempColor = u.temp ? 'rgba(255,255,255,0.75)' : dim; // soft white
  const tempText = u.temp ? v.temp.toFixed(1) : '--';
  const nibpColor = u.nibp ? '#FFFFFF' : dim;  // white
  const nibpText = u.nibp ? (v.sbp+'/'+v.dbp) : '--/--';

  return `
    <div class="monitor-v2">
      <svg viewBox="0 0 748 573" class="monitor-svg" preserveAspectRatio="xMidYMid meet">
        <image href="${ASSET_IMG.monitor_blank}" x="0" y="0" width="748" height="573"/>
        <text x="82" y="122" class="mv-val" fill="${hrColor}">${hrText}</text>
        <text x="82" y="179" class="mv-val" fill="${spo2Color}">${spo2Text}</text>
        <text x="82" y="236" class="mv-val" fill="${rrColor}">${rrText}</text>
        <text x="82" y="293" class="mv-val" fill="${tempColor}">${tempText}</text>
        <text x="82" y="350" class="mv-val-sm" fill="${nibpColor}">${nibpText}</text>
      </svg>
    </div>`;
}

function renderStage(){
  const stage = document.getElementById('stageArea');
  if(!stage) return;
  const stepData = STEPS[state.step];
  const contact = contactMade();
  const vitalsKnown = Object.values(state.vitalsUnlocked).some(Boolean);
  const st = vitalsKnown ? displayStatus() : null;

  const propKey = stepData.scenePropKey || (contact ? 'patient' : 'ambulance');
  const PROP_ASSET = {ambulance:'ambulance_v2', house:'house_v2', hospital:'hospital_v2', radio:'radio_v2', nurse:'nurse_v2', patient:'patient_v2'};
  const assetKey = PROP_ASSET[propKey] || 'patient_v2';
  const imageSlot = `<div class="image-slot"><img src="${ASSET_IMG[assetKey]}" alt="${propKey}"></div>`;

  let monitorHTML;
  if(!contact){
    monitorHTML = `<div class="monitor-v2"><div class="monitor-v2-placeholder">Monitor connects once you make patient contact.</div></div>`;
  } else if(!vitalsKnown){
    monitorHTML = `<div class="monitor-v2"><div class="monitor-v2-placeholder">Awaiting vitals.</div></div>`;
  } else {
    monitorHTML = renderMonitorSVG();
  }

  stage.className = 'stage';
  stage.innerHTML = `
    <div class="panel scene-box">
      ${imageSlot}
    </div>
    ${monitorHTML}
  `;

  // Lock the scene box to exactly the monitor's own height (which is driven only
  // by its fixed aspect ratio, not by whatever image happens to be on the left).
  const monitorEl = stage.querySelector('.monitor-v2');
  const sceneBoxEl = stage.querySelector('.scene-box');
  if(monitorEl && sceneBoxEl){
    const h = monitorEl.getBoundingClientRect().height;
    if(h > 0) sceneBoxEl.style.height = h + 'px';
  }
}

/* ---------------- TYPEWRITER ---------------- */
let renderGeneration = 0;

function typeText(el, text, done, myGeneration){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = text; if(done) done(); return; }
  let i=0; el.textContent='';
  const cursor=document.createElement('span'); cursor.className='cursor'; cursor.textContent='\u00A0';
  function tick(){
    if(myGeneration !== renderGeneration) return; // superseded by a later render - abort
    if(i<=text.length){ el.textContent = text.slice(0,i); el.appendChild(cursor); i+=2; setTimeout(tick,12); }
    else { el.textContent = text; if(done) done(); }
  }
  tick();
}

function logEntry(text,cls){ state.log.push({text,cls}); }
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

/* ---------------- MAIN RENDER ---------------- */
function renderApp(skipTyping){
  renderGeneration++;
  const myGeneration = renderGeneration;
  const app = document.getElementById('app');
  const stepData = STEPS[state.step];

  if(stepData.type==='end'){ renderDebrief(app); saveProgress(); return; }

  app.innerHTML = `
    <div class="stage" id="stageArea"></div>
    <div class="story panel">
      <div class="story-phase">${stepData.storyLabel || stepData.phase}</div>
      ${stepData.sceneProp ? `<div class="scene-prop"><img src="${ASSET_IMG[stepData.sceneProp.key]}" alt="${stepData.sceneProp.caption}"><span>${stepData.sceneProp.caption}</span></div>` : ''}
      <div class="story-text" id="storyText"></div>
      <div id="feedbackArea"></div>
      <div id="choiceArea"></div>
    </div>
    <details class="log-details" id="logDetails">
      <summary>Run Log (${state.log.length})</summary>
      <div class="log-body" id="logArea"></div>
    </details>
  `;

  renderPhaseTrack();
  renderStage();
  renderLog();

  const storyEl = document.getElementById('storyText');
  const finishSetup = ()=>{
    if(stepData.contactPoint){ renderStage(); }

    if(stepData.type==='narrative'){
      const area = document.getElementById('choiceArea');
      area.innerHTML = `<button class="continue-btn" id="continueBtn">Continue &#8594;</button>`;
      document.getElementById('continueBtn').onclick = ()=>{ state.step = stepData.next; saveProgress(); renderApp(); };
    } else if(stepData.type==='decision'){
      renderDecisionChoices(stepData);
    } else if(stepData.type==='interview'){
      renderInterview(stepData);
    } else if(stepData.type==='report'){
      renderReport(stepData);
    } else if(stepData.type==='airway'){
      renderAirway(stepData);
    } else if(stepData.type==='medbag'){
      renderMedBag(stepData);
    } else if(stepData.type==='ppe'){
      renderPPE(stepData);
    } else if(stepData.type==='intro'){
      renderIntro(stepData);
    } else if(stepData.type==='vitals'){
      renderVitals(stepData);
    } else if(stepData.type==='resources'){
      renderResources(stepData);
    }
  };

  const resolvedText = typeof stepData.text === 'function' ? stepData.text() : stepData.text;

  if(skipTyping){ storyEl.textContent = resolvedText; finishSetup(); }
  else { typeText(storyEl, resolvedText, finishSetup, myGeneration); }
}

function handleChoice(stepData, idx){
  const choice = stepData.choices[idx];
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);

  const d = choice.delta || {};
  applyDelta(d);
  renderStage();

  renderFeedback([{cls:choice.fb.cls, text:choice.fb.text}]);
  logEntry(choice.label + ' — ' + choice.fb.text, choice.fb.cls);
  renderLog();
  saveProgress();

  addContinueButton(()=>{ state.step = choice.next; saveProgress(); renderApp(); });

function applyDelta(d){
  if(d.hr) state.vitals.hr = clamp(state.vitals.hr + d.hr, 40, 170);
  if(d.rr) state.vitals.rr = clamp(state.vitals.rr + d.rr, 8, 44);
  if(d.spo2) state.vitals.spo2 = clamp(state.vitals.spo2 + d.spo2, 70, 99);
  if(d.score) state.score += d.score;
}

/* Shown after a wrong answer: Try Again resets the step for a real retry;
   Move On shows what the correct action would have been, applies its
   effects as if the student had done it, and lets them continue. */
function offerTryAgainOrMoveOn(retryFn, stepData, ideal, logPrefix){
  const tryBtn = addTryAgainButton(retryFn);
  const moveBtn = addMoveOnButton(()=>{
    tryBtn.remove();
    moveBtn.remove();
    if(ideal.unlock){
      ideal.unlock.forEach(field=>{ state.vitalsUnlocked[field] = true; });
    }
    applyDelta(ideal.delta || {});
    renderStage();
    renderFeedback([{cls:'good', text:"Here's what we were looking for: " + ideal.text}]);
    logEntry(logPrefix + ' (moved on) — ' + ideal.text, 'good');
    renderLog();
    saveProgress();
    addContinueButton(()=>{ state.step = stepData.next; saveProgress(); renderApp(); });
  });
}

/* Shrinks a whole group of elements together to a single shared font-size
   (rather than each one independently), so every card in a grid displays
   text at the same size instead of varying card-to-card. Still wraps only
   at word boundaries and never clips text. */
function fitUniform(elements, maxLines){
  if(!elements || !elements.length) return;
  const lineHeightRatio = 1.25; // matches the CSS line-height set on these labels
  const original = parseFloat(window.getComputedStyle(elements[0]).fontSize);
  const minSize = Math.max(7, original*0.4);
  elements.forEach(el=>{
    el.style.whiteSpace = 'normal';
    el.style.overflowWrap = 'normal';
    el.style.wordBreak = 'normal';
    el.style.overflow = 'visible';
  });
  const applySize = (s)=> elements.forEach(el=> el.style.fontSize = s+'px');
  const fitsAll = (s)=> elements.every(el=> el.scrollHeight <= (s*lineHeightRatio*maxLines + 1));

  let size = original;
  applySize(size);
  let guard = 0;
  while(!fitsAll(size) && size > minSize && guard < 60){
    size -= 0.5;
    applySize(size);
    guard++;
  }
}
function fitGridLabels(gridId){
  const grid = document.getElementById(gridId);
  if(!grid) return;
  fitUniform(Array.from(grid.querySelectorAll('.item-label')), 2);
  fitUniform(Array.from(grid.querySelectorAll('.item-sub')), 1);
}

  fitGridLabels('deviceGrid');
  fitGridLabels('medGrid');
  renderStage();
});

  askBtn.onclick = send;
  input.onkeydown = (e)=>{ if(e.key==='Enter'){ send(); } };

  document.getElementById('interviewNextBtn').onclick = ()=>{
    const missing = SAMPLE_ITEMS.filter(it=>!state.sampleProgress[it.key]).map(it=>it.label);
    if(!state.painAsked) missing.push('Pain Assessment (ask if he has any pain)');
    if(state.painReported){
      OPQRST_ITEMS.filter(it=>!state.opqrstProgress[it.key]).forEach(it=>missing.push('OPQRST: '+it.label));
    }
    const proceed = ()=>{ state.step = stepData.next; saveProgress(); renderApp(); };
    if(missing.length){
      showConfirmModal("You haven't covered: " + missing.join(', ') + ". Continue anyway?", proceed);
    } else {
      proceed();
    }
  };
}

function renderChatLog(){
  const win = document.getElementById('chatWindow');
  if(!win) return;
  if(state.chatLog.length===0){
    win.innerHTML = '<div class="chat-window-empty">Ask a question below to start the interview...</div>';
    return;
  }
  win.innerHTML = state.chatLog.map(m=>`<div class="chat-bubble ${m.role==='you'?'chat-you':'chat-patient'}">${escapeHtml(m.text)}</div>`).join('');
  win.scrollTop = win.scrollHeight;
}

function renderChecklists(){
  const list = document.getElementById('sampleList');
  if(list){
    list.innerHTML = SAMPLE_ITEMS.map(it=>{
      const done = !!state.sampleProgress[it.key];
      return `<div class="sample-item ${done?'done':''}"><span class="sample-check">${done?'&#10003;':''}</span>${it.key} — ${it.label}</div>`;
    }).join('');
  }

  const painEl = document.getElementById('painStatus');
  if(painEl){
    painEl.innerHTML = `<div class="sample-item ${state.painAsked?'done':''}"><span class="sample-check">${state.painAsked?'&#10003;':''}</span>${state.painAsked ? (state.painReported ? 'Asked — pain present' : 'Asked — no pain reported') : 'Not yet asked'}</div>`;
  }

  const opqrstEl = document.getElementById('opqrstSection');
  if(opqrstEl){
    if(state.painReported){
      opqrstEl.innerHTML = `<div class="sample-title" style="margin-top:12px;">OPQRST (pain reported)</div>` +
        OPQRST_ITEMS.map(it=>{
          const done = !!state.opqrstProgress[it.key];
          return `<div class="sample-item ${done?'done':''}"><span class="sample-check">${done?'&#10003;':''}</span>${it.key} — ${it.label}</div>`;
        }).join('');
    } else {
      opqrstEl.innerHTML = '';
    }
  }
}

function askPatient(question){
  if(containsProfanity(question)){ showProfanityWarning(); return; }

  state.chatLog.push({role:'you', text:question});
  renderChatLog();
  saveProgress();

  const win = document.getElementById('chatWindow');
  const typingEl = document.createElement('div');
  typingEl.className = 'chat-typing';
  typingEl.textContent = 'Mr. Alvarez is responding...';
  win.appendChild(typingEl);
  win.scrollTop = win.scrollHeight;

  const askBtn = document.getElementById('askBtn');
  if(askBtn) askBtn.disabled = true;

  setTimeout(()=>{
    if(!win.isConnected) return;
    const reply = getPatientReply(question);
    state.chatLog.push({role:'patient', text:reply});
    if(askBtn) askBtn.disabled = false;
    renderChatLog();
    renderChecklists();
    saveProgress();
  }, 500 + Math.random()*400);
}

/* ---------------- REPORT ---------------- */
function renderReport(stepData){
  const area = document.getElementById('choiceArea');
  const already = state.reportAnswers[state.step];
  area.innerHTML = `
    <textarea class="report-textarea" id="reportInput" placeholder="Type your report here...">${already ? already : ''}</textarea>
    <div class="report-hint">${stepData.format}</div>
    <button class="submit-report-btn" id="submitReportBtn">Submit Report</button>
    <div id="reportCompare"></div>
  `;

  if(already){ showReportComparison(stepData, already); }

  document.getElementById('submitReportBtn').onclick = ()=>{
    const text = document.getElementById('reportInput').value.trim();
    if(!text){ showAlertModal('Type your report before submitting.'); return; }
    if(containsProfanity(text)){ showProfanityWarning(); return; }
    state.reportAnswers[state.step] = text;
    saveProgress();
    showReportComparison(stepData, text);
  };
}

function showReportComparison(stepData, yourText){
  const compareEl = document.getElementById('reportCompare');
  const model = stepData.modelAnswer(state.vitals);
  const existingSelfScore = state.reportSelfScores[state.step];
  compareEl.innerHTML = `
    <div class="compare-block">
      <div class="compare-label" style="color:var(--orange)">Your Report</div>
      <div class="your-report">${escapeHtml(yourText)}</div>
      <div class="compare-label" style="color:#1f5c3a">A Strong Example</div>
      <div class="model-report">${escapeHtml(model)}</div>
    </div>
    <div class="self-score-block">
      <div class="compare-label" style="color:var(--orange)">Rate Your Report (0–5)</div>
      <div class="self-score-row" id="selfScoreRow">
        ${[0,1,2,3,4,5].map(n=>`<button class="score-btn${existingSelfScore===n?' selected':''}" data-val="${n}" ${existingSelfScore!=null?'disabled':''}>${n}</button>`).join('')}
      </div>
      <div class="self-score-scale">0 = Poor &nbsp;•&nbsp; 5 = Excellent</div>
    </div>
  `;
  document.getElementById('submitReportBtn').disabled = true;

  if(existingSelfScore != null){
    addContinueButton(()=>{ state.step = stepData.next; saveProgress(); renderApp(); });
  } else {
    document.querySelectorAll('#selfScoreRow .score-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const val = parseInt(btn.dataset.val, 10);
        document.querySelectorAll('#selfScoreRow .score-btn').forEach(b=>{ b.disabled = true; });
        btn.classList.add('selected');
        state.reportSelfScores[state.step] = val;
        state.score += val;
        saveProgress();
        addContinueButton(()=>{ state.step = stepData.next; saveProgress(); renderApp(); });
      };
    });
  }
}

/* ---------------- LOG ---------------- */
function renderLog(){
  const el = document.getElementById('logArea');
  const summary = document.querySelector('#logDetails summary');
  if(summary) summary.textContent = `Run Log (${state.log.length})`;
  if(!el) return;
  el.innerHTML = state.log.map(l=>`<div class="log-item ${l.cls==='good'?'good':l.cls==='bad'?'bad':'mid'}">${l.text}</div>`).join('');
}

/* ---------------- DEBRIEF ---------------- */
const MAX_SCORE = 26; // sum of every 'good' path's score delta, plus up to 5+5 from self-scored reports

function computeGrade(){
  const pct = state.score / MAX_SCORE;
  if(pct >= 0.875) return {letter:'A', tier:"Excellent — Textbook Respiratory Management"};
  if(pct >= 0.6875) return {letter:'B', tier:"Good — Solid Care, Minor Gaps"};
  if(pct >= 0.5) return {letter:'C', tier:"Passing — Room to Tighten Up"};
  if(pct >= 0.25) return {letter:'D', tier:"Below Standard — Revisit Respiratory Protocols"};
  return {letter:'F', tier:"Needs Review — Revisit Respiratory Distress Protocols"};
}

function renderDebrief(app){
  renderPhaseTrack();
  const grade = computeGrade();

  const finalStatus = displayStatus();
  const outcomeText = finalStatus==='stable'
    ? "Mr. Alvarez is handed off breathing comfortably, sats holding, well ahead of where he started."
    : finalStatus==='caution' || finalStatus==='improving'
    ? "Mr. Alvarez is handed off improved from your initial contact, though still working somewhat to breathe — the ER team continues where you left off."
    : "Mr. Alvarez remains in significant distress at handoff. The ER team has to escalate care immediately on arrival.";

  app.innerHTML = `
    <div class="debrief">
      <div class="score-circle">${grade.letter}</div>
      <h2>Scenario Complete</h2>
      <div class="tier">${grade.tier}</div>
      <p style="max-width:480px;margin:0 auto 20px;line-height:1.5;">${outcomeText}</p>
      <div style="font-size:0.72rem;color:rgba(2,39,61,0.4);margin-top:-8px;margin-bottom:8px;">Score: ${state.score}/${MAX_SCORE}</div>
    </div>
    <details class="log-details" id="logDetails">
      <summary>Run Log (${state.log.length})</summary>
      <div class="log-body" id="logArea"></div>
    </details>
  `;
  renderLog();
}

/* ---------------- GLOBAL RESET ---------------- */
document.getElementById('resetBar').onclick = ()=>{
  showConfirmModal('Reset the scenario? This clears your saved progress.', ()=>{
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    clearProgress();
    renderApp();
  });
};

/* ---------------- INIT ---------------- */
(function init(){
  loadProgress();
  renderApp(true);
})();
</script>
